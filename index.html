<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>뷰티 AI 기초 과정</title>
    <style>
        body { font-family: 'Pretendard', sans-serif; background-color: #f8f9fa; margin: 0; padding: 20px; color: #333; }
        .container { max-width: 1000px; margin: 0 auto; }
        .header-banner { width: 100%; height: 200px; background-color: #0b1c3c; border-radius: 16px; margin-bottom: 20px; display: flex; align-items: center; justify-content: center; color: #d4af37; font-size: 40px; font-weight: bold; }
        h1 { font-size: 24px; margin-bottom: 20px; }
        .search-bar { width: 100%; padding: 15px; border: 1px solid #ddd; border-radius: 8px; font-size: 16px; margin-bottom: 20px; box-sizing: border-box; }
        .filters { display: flex; gap: 10px; margin-bottom: 20px; overflow-x: auto; padding-bottom: 10px; }
        .filter-btn { padding: 8px 16px; border: 1px solid #ddd; background-color: white; border-radius: 20px; cursor: pointer; white-space: nowrap; font-size: 14px; }
        .filter-btn.active { background-color: #5c6bc0; color: white; border: none; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 20px; }
        .card { background: white; border-radius: 12px; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,0.05); transition: transform 0.2s; cursor: pointer; }
        .card:hover { transform: translateY(-5px); box-shadow: 0 5px 15px rgba(0,0,0,0.1); }
        .card img { width: 100%; height: 250px; object-fit: cover; }
        .card-content { padding: 15px; }
        .tag { background-color: #e8eaf6; color: #3f51b5; padding: 4px 8px; border-radius: 4px; font-weight: bold; font-size: 12px; display: inline-block; }
    </style>
</head>
<body>

<div class="container">
    <div class="header-banner">Beauty AI</div>
    
    <h1>뷰티 AI 기초 과정 1.0ver</h1>
    
    <input type="text" class="search-bar" placeholder="프롬프트 검색: 제목, 내용 포함 검색">
    
    <div class="filters">
        <button class="filter-btn active">전체보기</button>
        <button class="filter-btn">기초과정 1주차</button>
        <button class="filter-btn">기초과정 2주차</button>
        <button class="filter-btn">기초과정 3주차</button>
    </div>

    <div class="grid">
        <div class="card">
            <img src="https://via.placeholder.com/300x250" alt="이미지">
            <div class="card-content">
                <div class="tag">1-1</div>
            </div>
        </div>
        <div class="card">
            <img src="https://via.placeholder.com/300x250" alt="이미지">
            <div class="card-content">
                <div class="tag">1-2</div>
            </div>
        </div>
        <div class="card">
            <img src="https://via.placeholder.com/300x250" alt="이미지">
            <div class="card-content">
                <div class="tag">1-3</div>
            </div>
        </div>
    </div>
</div>

</body>
</html>
